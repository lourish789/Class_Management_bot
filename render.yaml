services:
  - type: web
    name: whatsapp-coach-bot
    runtime: python
    plan: free
    buildCommand: "apt-get update && apt-get install -y portaudio19-dev && pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT main:app"
    autoDeploy: true
    envVars:
      - key: PINECONE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GREEN_API_ID
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
