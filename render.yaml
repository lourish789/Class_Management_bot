services:
  - type: web
    name: linka-ai-chatbot
    runtime: docker
    plan: free  # or free
    region: oregon  # Choose closest to your users
    branch: main
    
    # Health check configuration
    healthCheckPath: /health_check
    
    # Auto-deploy on push
    autoDeploy: true
    
    # Environment variables (set these in Render dashboard)
    envVars:
      - key: PINECONE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GREEN_API_ID_INSTANCE
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
      - key: APPS_SCRIPT_URL
        sync: false
      - key: SPREADSHEET_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: linka-ai-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
    
    # Resource scaling (adjust based on your plan)
    scaling:
      minInstances: 1
      maxInstances: 3
      targetCPUPercent: 70
      targetMemoryPercent: 80

